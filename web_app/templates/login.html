{% extends "base.html" %}

{% block title %}ログイン - 予定管理システム{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
    <div class="card-header bg-primary text-white text-center py-3">
      <h4 class="mb-0 fw-bold">予定管理システム ログイン</h4>
    </div>
    <div class="card-body p-4">
      {# ── 通常ログイン（ログインID＋パスワード） ── #}
      <form method="post" action="{{ url_for('auth.login') }}" id="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label for="login_id" class="form-label fw-semibold">ログインID</label>
          <input type="text" class="form-control" id="login_id" name="login_id"
                 value="{{ last_login_id }}" autocomplete="username"
                 placeholder="ログインID" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">パスワード</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="パスワード（4桁）" autocomplete="current-password"
                 maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="1">
          <label class="form-check-label small" for="remember_me">次回から自動ログインする</label>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">ログイン</button>
        </div>
      </form>

      <div class="mt-3 text-center">
        <a href="#" class="small text-secondary" id="show-init-pw-link">🔑 初回パスワードを設定する</a>
      </div>

      {# ── 初回パスワード設定（未設定ユーザー向け） ── #}
      <div id="init-pw-section" style="display:none;" class="mt-3 border-top pt-3">
        <p class="small text-muted mb-2">初めて利用する方は、ここでパスワードを設定してログインします。</p>
        <form method="post" action="{{ url_for('auth.reset_password_and_login') }}" id="init-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-2">
            <input type="text" class="form-control form-control-sm" name="login_id"
                   id="init_login_id" placeholder="ログインID" autocomplete="username" required>
          </div>
          <div class="mb-2">
            <input type="password" class="form-control form-control-sm" name="new_password"
                   id="new_password" placeholder="新しいパスワード（4桁）"
                   maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="new-password" required>
          </div>
          <div class="mb-2">
            <input type="password" class="form-control form-control-sm" name="new_password_confirm"
                   id="new_password_confirm" placeholder="確認（もう一度入力）"
                   maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="new-password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-warning btn-sm">パスワードを設定してログイン</button>
          </div>
        </form>
        <div class="mt-2 text-center">
          <a href="#" class="small text-secondary" id="cancel-init-link">← 通常ログインに戻る</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var loginForm = document.getElementById('login-form');
  var initSection = document.getElementById('init-pw-section');
  var showLink = document.getElementById('show-init-pw-link');
  var cancelLink = document.getElementById('cancel-init-link');
  var initLoginId = document.getElementById('init_login_id');

  showLink.addEventListener('click', function (e) {
    e.preventDefault();
    // 通常ログイン欄のIDを初回設定フォームへ引き継ぐ
    initLoginId.value = document.getElementById('login_id').value || '';
    loginForm.style.display = 'none';
    showLink.parentElement.style.display = 'none';
    initSection.style.display = '';
  });
  cancelLink.addEventListener('click', function (e) {
    e.preventDefault();
    initSection.style.display = 'none';
    loginForm.style.display = '';
    showLink.parentElement.style.display = '';
  });
})();
</script>
{% endblock %}
